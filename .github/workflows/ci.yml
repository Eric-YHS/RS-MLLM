name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Byte-compile all sources
        run: |
          python -m compileall -q . -x '(node_modules|\.git|__pycache__)'

      - name: Validate model and system JSON configs
        run: |
          python - <<'PY'
          import json, pathlib, re, sys

          for rel in [
              "config.json", "tokenizer_config.json", "special_tokens_map.json",
              "added_tokens.json", "preprocessor_config.json",
          ] + [str(p) for p in pathlib.Path("mul_lora_systems/configs").glob("*.json")]:
              path = pathlib.Path(rel)
              if not path.is_file():
                  sys.exit(f"缺少配置文件 {rel}")
              json.loads(path.read_text(encoding="utf-8"))

          # config.json 的 auto_map 决定 transformers 用哪份 remote code 建模，
          # 引用写错只在加载权重时才报错，这里提前校验模块与类都存在
          cfg = json.loads(pathlib.Path("config.json").read_text(encoding="utf-8"))
          for key, ref in cfg.get("auto_map", {}).items():
              mod_name, _, cls_name = ref.partition(".")
              mod = pathlib.Path(f"{mod_name}.py")
              if not mod.is_file():
                  sys.exit(f"auto_map[{key}] 引用的模块不存在：{ref}")
              if not re.search(rf"^class {cls_name}\b", mod.read_text(encoding="utf-8"), re.M):
                  sys.exit(f"auto_map[{key}] 引用的类不存在：{ref}")

          # LoRA 清单必须能被选择器使用：每个适配器都要有 path 与说明
          loras = json.loads(pathlib.Path("mul_lora_systems/configs/lora_config.json").read_text(encoding="utf-8"))
          for name, item in loras["lora_configs"].items():
              if not item.get("path"):
                  sys.exit(f"LoRA {name} 缺少 path")
          # lora_selector.LORASelector 里的 task→<task>_lora 是硬编码的，
          # 两份配置不一致时不会报错、只会默默回退到默认适配器，这里提前校验
          mapping = json.loads(pathlib.Path("mul_lora_systems/configs/task_mapping.json").read_text(encoding="utf-8"))
          for task in mapping["task_priority"]:
              if f"{task}_lora" not in loras["lora_configs"]:
                  sys.exit(f"task_priority 里的 {task} 在 lora_config.json 中没有对应的 {task}_lora")
          if mapping["default_lora"] not in loras["lora_configs"]:
              sys.exit(f"default_lora {mapping['default_lora']} 未在 lora_config.json 中定义")
          if not mapping["keywords"]:
              sys.exit("task_mapping.json 的 keywords 为空，任务分类器无法工作")
          print(f"ok: {len(loras['lora_configs'])} 个 LoRA 配置与 task_mapping 一致，auto_map 校验通过")
          PY

      - name: Check Dockerfile entrypoints exist
        run: |
          python - <<'PY'
          import pathlib, re, sys

          for rel in ["Dockerfile", "YAOGAN_CHAT-main/backend/Dockerfile"]:
              text = pathlib.Path(rel).read_text(encoding="utf-8")
              m = re.search(r'^CMD\s+\[(.*)\]', text, re.M)
              if not m:
                  sys.exit(f"{rel} 没有 CMD")
              for token in re.findall(r'"([^"]+\.py)"', m.group(1)):
                  if not pathlib.Path(token).is_file():
                      sys.exit(f"{rel} 的 CMD 引用了不存在的脚本：{token}")
          print("ok: Dockerfile 入口脚本均存在")
          PY

      - name: Fail on tracked build artifacts
        run: |
          set -euo pipefail
          out=$(git ls-files | grep -E '(__pycache__|\.pyc$|/node_modules/|\.bin$|\.safetensors$)' || true)
          if [ -n "$out" ]; then
            echo "::error::以下编译产物/权重不应入库："
            echo "$out"
            exit 1
          fi

  # 密钥一旦 commit 进历史就很难清干净（science-pop 就漏过一个 Coze PAT）。
  # 这里只匹配高置信度的前缀，不做熵分析，避免把 CI 变成误报噪音。
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for committed credentials
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          PATTERNS = [
              ("GitHub token", re.compile(r"\b(ghp|gho|ghu|ghs|ghr)_[0-9A-Za-z]{20,}\b")),
              ("GitHub fine-grained PAT", re.compile(r"\bgithub_pat_[0-9A-Za-z_]{30,}\b")),
              ("OpenAI-style key", re.compile(r"\bsk-[0-9A-Za-z_-]{20,}\b")),
              ("AWS access key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("Slack token", re.compile(r"\bxox[baprs]-[0-9A-Za-z-]{10,}\b")),
              ("Google API key", re.compile(r"\bAIza[0-9A-Za-z_-]{30,}\b")),
              ("WeChat app secret", re.compile(
                  r"(?i)\b(wxappsecret|wx_app_secret|app_secret)\b\s*[:=]\s*['\"]?([0-9a-f]{32})['\"]?")),
              ("Coze PAT", re.compile(r"\bpat_[0-9A-Za-z]{20,}\b")),
          ]
          SKIP = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".pdf", ".zip", ".gz",
                  ".pkl", ".pt", ".pth", ".ckpt", ".onnx", ".bin", ".dll", ".so", ".pdb",
                  ".docx", ".hdr", ".ttf", ".woff", ".woff2", ".mp3", ".mp4", ".wav", ".h5",
                  ".safetensors", ".lock", ".whl", ".jar", ".class"}

          files = subprocess.run(["git", "ls-files", "-z"], capture_output=True,
                                 text=True).stdout.split("\0")
          hits = []
          for name in filter(None, files):
              if name.endswith(tuple(SKIP)):
                  continue
              try:
                  blob = open(name, "rb").read(2 * 1024 * 1024)
              except OSError:
                  continue
              if b"\0" in blob:
                  continue
              text = blob.decode("utf-8", "replace")
              for label, pat in PATTERNS:
                  for m in pat.finditer(text):
                      hits.append(f"{label}: {name}: {m.group(0)[:24]}")
          if hits:
              print("\n".join(hits))
              sys.exit("发现疑似明文密钥（见上）；确认是误报就把该文件加进 SKIP 或换成占位符")
          print(f"ok  已扫描 {len([f for f in files if f])} 个文件，未发现明文密钥")
          PY
